[project]
name = "bvagent"
version = "0.1.0"
description = "Real-time Bangla voice agent with per-stage latency profiling"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[openai,silero,webrtc,websocket]==1.10.0",
    "faster-whisper>=1.2",
    "transformers>=5.0",
    "torch>=2.6",
    "numpy>=1.26",
    "soundfile>=0.13",
    "nltk>=3.9",
    "python-dotenv>=1.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
bvagent-bench = "bvagent.bench.run:main"
bvagent-sweep = "bvagent.bench.sweep:main"
bvagent-serve = "bvagent.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bvagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
